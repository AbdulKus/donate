px}.qr-wrap{display:grid;place-items:center;margin:4px 0 18px}.qr-frame{position:relative;padding:18px;border-radius:20px;background:#fff}.qr{width:232px;height:232px}.qr img,.qr canvas{width:232px!important;height:232px!important}.qr-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border:5px solid #fff;border-radius:11px;background:#fff;display:grid;place-items:center;overflow:hidden}.qr-logo img{width:26px;height:26px}.label{display:block;margin:0 0 7px;color:var(--muted);font-size:12px;font-weight:650}.address-row{display:flex;align-items:center;gap:9px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}.address{min-width:0;flex:1;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;user-select:all}.copy-btn{border:0;border-radius:10px;background:var(--text);color:var(--bg);padding:10px 12px;font-size:12px;font-weight:800;cursor:pointer}.warn{margin:10px 2px 0;color:var(--muted);font-size:12px;line-height:1.45}.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:999px;font-size:13px;font-weight:750;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}button:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:3px}@media(max-width:520px){.content{align-items:flex-start;padding-top:48px}dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:24px 24px 0 0}.modal{padding-bottom:max(22px,env(safe-area-inset-bottom))}.qr,.qr img,.qr canvas{width:min(232px,62vw)!important;height:min(232px,62vw)!important}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let lang='en',curN=null,curC=null,timer;const $=s=>document.querySelector(s),home=$('#home'),crypto=$('#crypto'),groups=$('#groups'),wallet=$('#wallet'),qr=$('#qrcode'),toast=$('#toast');window.fail=x=>{x.style.display='none';if(x.nextElementSibling)x.nextElementSibling.style.display='inline'};const img=(url,f)=>`<img src="${url}" alt="" onerror="fail(this)"><span class="fallback">${f}</span>`;const coinImg=s=>img(icon(s),s);N.forEach(n=>{const e=document.createElement('section');e.className='network';e.innerHTML=`<div class="network-head"><span class="icon">${img('https://api.iconify.design/'+n.ni,n.name[0])}</span><div><h3>${n.name}</h3><p>${n.tag}</p></div></div><div class="coins">${n.c.map((c,i)=>`<button class="coin" data-i="${i}"><span class="coin-icon">${coinImg(c[0])}</span><span class="symbol">${c[0]}</span></button>`).join('')}</div>`;e.querySelectorAll('.coin').forEach(b=>b.onclick=()=>openWallet(n,n.c[+b.dataset.i]));groups.appendChild(e)});
function tr(k){return T[lang]?.[k]||T.en[k]||k}function setLang(l,save=true){lang=T[l]?l:'en';document.documentElement.lang=lang;if(save)localStorage.setItem('donate-language',lang);document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));document.querySelectorAll('.lang').forEach(e=>e.setAttribute('aria-pressed',e.dataset.lang===lang));document.title=tr('title');if(curN&&curC)$('#warning').textContent=tr('warn').replace('{coin}',curC[0]).replace('{network}',curN.name)}function detect(){const s=localStorage.getItem('donate-language');if(T[s])return s;for(const l of navigator.languages||[navigator.language]){const x=(l||'en').split('-')[0].toLowerCase();if(T[x])return x}return'en'}
function link(n,c){return'https://link.trustwallet.com/send?'+new URLSearchParams({asset:c[2],address:n.a})}function openWallet(n,c){curN=n;curC=c;$('#modalTitle').textContent=c[0];$('#modalSub').textContent=c[1]+' · '+n.name;$('#walletAddress').textContent=n.a;$('#modalIcon').innerHTML=coinImg(c[0]);$('#qrLogo').innerHTML=coinImg(c[0]);$('#warning').textContent=tr('warn').replace('{coin}',c[0]).replace('{network}',n.name);qr.textContent='';const u=link(n,c);if(window.QRCode)new QRCode(qr,{text:u,width:232,height:232,colorDark:'#111',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H});else qr.textContent=u;wallet.showModal()}

$('#cryptoBtn').onclick=()=>showCrypto();$('#back').onclick=()=>history.state?.v==='crypto'?history.back():showHome();$('#close').onclick=()=>wallet.close();$('#copyBtn').onclick=async()=>{if(!curN)return;try{await navigator.clipboard.writeText(curN.a)}catch{const t=document.createElement('textarea');t.value=curN.a;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}flash(tr('copied'))};wallet.onclick=e=>{const r=wallet.getBoundingClientRect();if(!(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom))wallet.close()};document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));addEventListener('popstate',()=>location.hash==='#crypto'?showCrypto(false):showHome(false));setLang(detect(),false);if(location.hash==='#crypto')showCrypto(false);
