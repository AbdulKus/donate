function openPay(n,c){curN=n;curC=c;$('#modalTitle').textContent=c[0];$('#modalSub').textContent=c[1]+' · '+n.name;$('#walletAddress').textContent=n.a;$('#modalIcon').innerHTML=coinImg(c[0]);$('#warning').textContent=tr('warn').replace('{coin}',c[0]).replace('{network}',n.name);qr.textContent='';const u=payload(n,c);if(window.QRCode)new QRCode(qr,{text:u,width:232,height:232,colorDark:'#111',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});else qr.textContent=u;startWalletCycle();wallet.showModal()}
function animate(el,html){el.innerHTML=html;el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap')}function startCrypto(){const a=['BTC','ETH','SOL','TON','BNB','USDT'];let i=0,el=$('#cryptoIcon'),draw=()=>animate(el,coinImg(a[i++%a.length]));draw();if(!matchMedia('(prefers-reduced-motion:reduce)').matches)cryptoTimer=setInterval(draw,1400)}function startWalletCycle(){clearInterval(cycleTimer);const a=wallets(curN);let i=0,el=$('#walletCycle'),draw=()=>animate(el,walletImg(a[i++%a.length]));draw();if(a.length>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches)cycleTimer=setInterval(draw,1250)}
async function copyAddr(show=true){if(!curN)return;try{await navigator.clipboard.writeText(curN.a)}catch{const x=document.createElement('textarea');x.value=curN.a;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}if(show)flash(tr('copied'))}function launch(k){const t=token(curC),base=W[k][2];if(k==='trust')return trust(curN,curC);if(k==='metamask'&&curN.f==='evm')return t?`https://metamask.app.link/send/${t}@${curN.chain}/transfer?address=${curN.a}`:`https://metamask.app.link/send/${curN.a}@${curN.chain}`;if(k==='phantom')return`https://phantom.app/ul/browse/${encodeURIComponent(location.href.split('#')[0]+'#crypto')}?ref=${encodeURIComponent(location.origin)}`;if(k==='myton'&&curN.f==='ton')return t?`https://my.tt/transfer/${curN.a}?jetton=${encodeURIComponent(t)}`:`https://my.tt/transfer/${curN.a}`;if(k==='tonkeeper'&&curN.f==='ton')return payload(curN,curC);return base}
function showPicker(){if(!curN)return;$('#pickerSub').textContent=curC[0]+' · '+curN.name;const list=$('#walletList');list.innerHTML='';const any=document.createElement('button');any.className='wallet-item';any.innerHTML=`<span class="wallet-logo">◌</span><span class="wallet-name">${tr('anyWallet')}</span><span class="arrow">›</span>`;any.onclick=async()=>{await copyAddr(false);picker.close();location.href=payload(curN,curC)};list.appendChild(any);wallets(curN).forEach(k=>{const b=document.createElement('button');b.className='wallet-item';b.innerHTML=`<span class="wallet-logo">${walletImg(k)}</span><span class="wallet-name">${W[k][0]}</span><span class="arrow">›</span>`;b.onclick=async()=>{await copyAddr(false);picker.close();location.href=launch(k)};list.appendChild(b)});picker.showModal()}
function showCrypto(push=true){home.hidden=true;crypto.hidden=false;if(push&&location.hash!=='#crypto')history.pushState({v:'crypto'},'','#crypto');scrollTo(0,0)}function showHome(push=true){if(wallet.open)wallet.close();if(picker.open)picker.close();crypto.hidden=true;home.hidden=false;if(push&&location.hash)history.pushState({v:'home'},'',location.pathname+location.search);scrollTo(0,0)}function flash(x){clearTimeout(timer);toast.textContent=x;toast.classList.add('show');timer=setTimeout(()=>toast.classList.remove('show'),1500)}
$('#cryptoBtn').onclick=()=>showCrypto();$('#back').onclick=()=>history.state?.v==='crypto'?history.back():showHome();$('#close').onclick=()=>wallet.close();$('#copyBtn').onclick=()=>copyAddr();$('#openWallet').onclick=showPicker;$('#pickerClose').onclick=()=>picker.close();[wallet,picker].forEach(d=>d.onclick=e=>{const r=d.getBoundingClientRect();if(!(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom))d.close()});document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));addEventListener('popstate',()=>location.hash==='#crypto'?showCrypto(false):showHome(false));setLang(detect(),false);startCrypto();if(location.hash==='#crypto')showCrypto(false);
</script></body></html>
